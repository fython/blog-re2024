<svg xmlns="http://www.w3.org/2000/svg" width="660" height="880" viewBox="0 0 660 880" role="img" aria-labelledby="title desc">
  <title id="title">无线 CarPlay 从握手到触控的时序</title>
  <desc id="desc">时间向下。iPhone 和 WheelPlay 通过蓝牙交换 Wi-Fi 配置，经 Wi-Fi 验证 AirPlay 会话并协商端口。iPhone 发送媒体，WheelPlay 向浏览器输出画面，再将浏览器的触控转成 HID 报告回传。</desc>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#236854"/></marker>
    <marker id="touch" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#924622"/></marker>
  </defs>
  <style>
    text {font: 18px system-ui, sans-serif; text-anchor: middle; fill: #153e34}
    .actor {font-size: 21px; font-weight: 650}
    .phase {font-weight: 650; text-anchor: start}
  </style>
  <rect width="660" height="880" rx="18" fill="#f8faf7"/>
  <path d="M84 66V857" stroke="#81a99b" stroke-dasharray="4 5"/>
  <rect x="9" y="18" width="150" height="48" rx="10" fill="white" stroke="#81a99b"/><text class="actor" x="84" y="49">iPhone</text>
  <path d="M330 66V857" stroke="#81a99b" stroke-dasharray="4 5"/>
  <rect x="255" y="18" width="150" height="48" rx="10" fill="white" stroke="#81a99b"/><text class="actor" x="330" y="49">WheelPlay</text>
  <path d="M576 66V857" stroke="#81a99b" stroke-dasharray="4 5"/>
  <rect x="501" y="18" width="150" height="48" rx="10" fill="white" stroke="#81a99b"/><text class="actor" x="576" y="49">车机浏览器</text>
  <rect x="15" y="82" width="630" height="34" rx="6" fill="#e7f2eb"/><text class="phase" x="32" y="106">蓝牙 · iAP2 引导</text>
  <text x="207" y="152">配件识别与 MFi 认证</text><path d="M84 160H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="207" y="200">请求 Wi-Fi 配置</text><path d="M84 208H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <text x="207" y="247">返回 Wi-Fi 配置</text><path d="M330 255H84" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <rect x="15" y="277" width="630" height="34" rx="6" fill="#e7f2eb"/><text class="phase" x="32" y="301">Wi-Fi · AirPlay 控制会话</text>
  <text x="207" y="351">配对验证、查询能力（/info）</text><path d="M84 359H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="207" y="399">SETUP · 会话参数</text><path d="M84 407H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <text x="207" y="447">事件端口、时钟同步端口</text><path d="M330 455H84" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <text x="207" y="495">SETUP · 协商各媒体流</text><path d="M84 503H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)" marker-start="url(#tip)"/>
  <text x="207" y="543">RECORD · 通知会话已激活</text><path d="M84 551H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <rect x="15" y="575" width="630" height="34" rx="6" fill="#e7f2eb"/><text class="phase" x="32" y="599">使用中 · 显示与触控</text>
  <text x="207" y="649">视频帧、音频流</text><path d="M84 657H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <text x="453" y="697">WebRTC 或图片流</text><path d="M330 705H576" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
  <text x="453" y="745">网页上的触控</text><path d="M576 753H330" stroke="#924622" stroke-width="2" marker-end="url(#touch)"/>
  <text x="207" y="793">事件通道 · HID 触控报告</text><path d="M330 801H84" stroke="#924622" stroke-width="2" marker-end="url(#touch)"/>
  <text x="207" y="841">TEARDOWN · 停止流</text><path d="M84 849H330" stroke="#236854" stroke-width="2" marker-end="url(#tip)"/>
</svg>
