  <rect x="397.0" y="1096" width="190" height="46" rx="23.0" class="dom"/>
  <text x="492" y="1126" class="code">&lt;canvas&gt;</text>
  <path class="edge" d="M492 1142V1189"/>
  <rect x="771.0" y="1096" width="190" height="46" rx="23.0" class="dom"/>
  <text x="866" y="1126" class="code">&lt;img&gt;</text>
  <path class="edge" d="M866 1142V1189"/>
  <rect x="36" y="1196" width="928" height="75" rx="14" class="api"/>
  <text x="500" y="1243" class="head">车机屏幕</text>
</svg>
