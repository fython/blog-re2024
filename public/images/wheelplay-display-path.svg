  <text x="365" y="981" class="code">ctx.drawImage(…)</text>
  <path class="edge" d="M623 930V948"/>
  <rect x="504.0" y="951" width="238" height="46" rx="4" class="api"/>
  <text x="623" y="981" class="code">gl.texImage2D(…)</text>
  <path class="edge" d="M623 997V1011"/>
  <rect x="504.0" y="1014" width="238" height="46" rx="4" class="api"/>
  <text x="623" y="1044" class="code">gl.drawArrays(…)</text>
  <path class="edge" d="M365 997V1076H492V1093"/>
  <path class="edge" d="M623 1060V1076H492V1093"/>
  <path class="edge" d="M246 554H124V1093"/>
  <path class="edge" d="M866 623V1093"/>
  <rect x="29.0" y="1096" width="190" height="46" rx="23.0" class="dom"/>
  <text x="124" y="1126" class="code">&lt;video&gt;</text>
