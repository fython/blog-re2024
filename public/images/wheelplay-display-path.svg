  <text x="623" y="659" class="">得到 VideoFrame</text>
  <path class="edge" d="M246 554H367V574"/>
  <rect x="258.0" y="577" width="218" height="46" rx="23.0" class="dom"/>
  <text x="367" y="607" class="code">&lt;video&gt; 帧来源</text>
