  <text x="367" y="707" class="code">video.requestVideo</text>
  <text x="367" y="732" class="code">FrameCallback(…)</text>
  <rect x="757.0" y="412" width="218" height="70" rx="4" class="api"/>
  <text x="866" y="441" class="code">URL.createObjectURL</text>
  <text x="866" y="466" class="code">(blob)</text>
  <path class="edge" d="M866 482V503"/>
  <rect x="757.0" y="506" width="218" height="46" rx="4" class="api"/>
  <text x="866" y="536" class="code">image.src = url</text>
  <path class="edge" d="M866 552V574"/>
  <rect x="757.0" y="577" width="218" height="46" rx="4" class="api"/>
  <text x="866" y="607" class="code">image.onload</text>
  <path class="edge" d="M367 748V771H494V792"/>
  <path class="edge" d="M623 623V634M623 674V771H494V792"/>
  <rect x="271.0" y="797" width="446" height="46" rx="4" class="api"/>
  <text x="494" y="827" class="code">按帧尺寸更新画布 · 选择绘制后端</text>
  <path class="edge" d="M494 843V858H365V879"/>
  <path class="edge" d="M494 843V858H623V879"/>
  <rect x="246.0" y="884" width="238" height="46" rx="4" class="api"/>
  <text x="365" y="914" class="code">getContext("2d")</text>
  <rect x="504.0" y="884" width="238" height="46" rx="4" class="api"/>
  <text x="623" y="914" class="code">getContext("webgl")</text>
