<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1950" viewBox="0 0 1000 1300" role="img" aria-labelledby="title desc">
  <title id="title">从 WheelPlay 服务端到车机屏幕</title>
  <desc id="desc">矩形标出 JS 调用、属性和事件，胶囊形标出 DOM 元素。pc 是 RTCPeerConnection 实例，其 ontrack 处理器通过 event.track 取得远端视频轨。原生 Video 与兼容 Canvas 共用媒体流绑定和播放步骤，随后原生路径显示 video。兼容 Canvas 从 video 取帧，直接 Canvas 从视频轨读取 VideoFrame，两者都用 2D 或 WebGL 画到 canvas。WebSocket 图片流显示 img。三个可见元素各自指向车机屏幕。</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7Z" fill="#236854"/></marker></defs>
  <style>
    text {font:20px system-ui,sans-serif;text-anchor:middle;fill:#153e34}
    .head {font-size:24px;font-weight:650}
    .code {font:18px ui-monospace,monospace}
    .api {fill:white;stroke:#81a99b;stroke-width:1.5}
    .dom {fill:#ffefda;stroke:#aa7346;stroke-width:1.8}
    .edge {fill:none;stroke:#236854;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="1300" rx="18" fill="#f8faf7"/>
  <rect x="14" y="65" width="972" height="145" rx="16" fill="#e7f2eb" stroke="#81a99b"/>
  <rect x="14" y="230" width="972" height="935" rx="16" fill="#eff6f1" stroke="#81a99b"/>
  <!-- Canvas inputs share a drawing backend after their source-specific steps. -->
  <g fill-opacity=".20" stroke-opacity=".42">
    <rect x="22" y="358" width="214" height="796" rx="17" fill="#87b4e6" stroke="#709bc8"/>
    <rect x="241" y="358" width="251" height="406" rx="17" fill="#e4bb73" stroke="#be974e"/>
    <rect x="495" y="358" width="256" height="406" rx="17" fill="#b09ccc" stroke="#9983b6"/>
  </g>
  <rect x="240" y="15" width="32" height="24" rx="3" class="api"/>
  <text x="387" y="36" class="">JS 调用、属性或事件</text>
  <rect x="530" y="15" width="48" height="24" rx="12" class="dom"/>
  <text x="650" y="36" class="">DOM 元素</text>
  <text x="500" y="102" class="head">WheelPlay 服务端 · CarPlay 编码帧</text>
  <rect x="132.5" y="143" width="475" height="46" rx="4" class="api"/>
  <text x="370" y="173" class="code">WebRTC · 转发兼容的 H.264 / HEVC</text>
  <rect x="762.0" y="143" width="208" height="46" rx="4" class="api"/>
  <text x="866" y="173" class="code">WebSocket 图片流</text>
  <text x="866" y="132" class="">解码为 JPEG / WebP</text>
  <text x="138" y="267" class="head">车机浏览器</text>
  <path class="edge" d="M370 189V243"/>
  <rect x="238" y="246" width="442" height="85" rx="4" class="api"/>
  <text x="459" y="272" class="code">pc.ontrack</text>
  <text x="459" y="298">WebRTC · RTCPeerConnection 的 track 事件</text>
  <text x="459" y="322">从 event.track 取得远端视频轨</text>
  <path class="edge" d="M866 189V282"/>
  <rect x="761.0" y="285" width="210" height="46" rx="4" class="api"/>
  <text x="866" y="315" class="code">socket.onmessage</text>
  <path class="edge" d="M370 331V345H246V409"/>
  <path class="edge" d="M370 331V345H623V366"/>
  <text x="124" y="393" class="head">原生 Video</text>
  <text x="367" y="393" class="head">兼容 Canvas</text>
  <text x="623" y="393" class="head">直接 Canvas</text>
  <text x="866" y="393" class="head">图片流</text>
  <path class="edge" d="M866 331V364"/>
  <rect x="60" y="412" width="372" height="55" rx="4" class="api"/>
  <text x="246" y="446" class="code">video.srcObject = stream</text>
  <path class="edge" d="M246 467V487"/>
  <rect x="60" y="490" width="372" height="46" rx="4" class="api"/>
  <text x="246" y="520" class="code">video.play()</text>
  <path d="M246 536V554" fill="none" stroke="#236854" stroke-width="2"/>
  <rect x="498.0" y="412" width="250" height="70" rx="4" class="api"/>
  <text x="623" y="441" class="code">new MediaStreamTrack</text>
  <text x="623" y="466" class="code">Processor(…)</text>
  <path class="edge" d="M623 482V503"/>
  <rect x="500.0" y="506" width="246" height="46" rx="4" class="api"/>
  <text x="623" y="536" class="code">readable.getReader()</text>
